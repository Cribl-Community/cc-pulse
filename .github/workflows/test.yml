# Test: lint, tests and a full build on every pull request and push to main.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # npm test includes browser suites; they find Playwright through `npm root -g`.
      - name: Install Playwright for the browser tests
        run: |
          npm install -g playwright@1.65.0
          playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      - run: npm run build
