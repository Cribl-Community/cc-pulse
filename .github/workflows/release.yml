# Release: on a vX.Y.Z tag, build the app, publish the Import-from-Git layout, create the GitHub Release
# with the .tgz, and submit it to the Cribl Marketplace (Packs Dispensary).
#
# The same process as cc-pack-generator's release.yml, which Cribl-Community repos share:
#   vX.Y.Z          production: uploads to the Dispensary with the org's PACKS_API_TOKEN
#   vX.Y.Z-staging  rehearsal:  uploads to the staging Dispensary with PACKS_API_TOKEN_STAGING, and does not
#                               move `latest` or `release`, so Git installs are untouched
#
# Cribl-Community org settings it reads (the same ones cc-pack-generator uses; nothing to set per repo):
#   secret   PACKS_API_TOKEN               Marketplace personal access token, production
#   secret   PACKS_API_TOKEN_STAGING       the same, for staging
#   variable DISPENSARY_ENDPOINT           https://packs.cribl.io/extapi/v1/packs
#   variable DISPENSARY_ENDPOINT_STAGING   https://packs-staging.cribl.io/extapi/v1/packs
# A token that is not set: build and Release only, with a warning.
#
# A green run means "submitted", not "live": the app waits for Cribl review in the Marketplace.
# Missed or failed a release? Actions → Release → Run workflow, with the existing tag.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-staging']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.3.0 or v0.3.0-staging)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      # npm test includes browser suites; they find Playwright through `npm root -g`.
      - name: Install Playwright for the browser tests
        run: |
          npm install -g playwright@1.65.0
          playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test

      - name: Build the package
        run: |
          # A -staging tag packages the same X.Y.Z as its production tag.
          VERSION="${TAG#v}"
          VERSION="${VERSION%-staging}"
          npm run package -- --version "$VERSION"
          NAME="$(node -p 'require("./package.json").name')"
          TGZ="build/$NAME-$VERSION.tgz"
          test -f "$TGZ"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"

      - name: Publish the layout for Import from Git
        run: |
          # Import from Git reads static/ and default/ at the repo root, so the release commit carries them
          # (main stays source-only). Skip if this tag already has them, e.g. on a re-run.
          if git ls-files --error-unmatch static/index.html >/dev/null 2>&1; then
            echo "$TAG already carries the Git-install layout"
            exit 0
          fi
          mkdir "$RUNNER_TEMP/layout"
          tar -xzf "$TGZ" -C "$RUNNER_TEMP/layout"
          rm -rf static default
          cp -R "$RUNNER_TEMP/layout/static" "$RUNNER_TEMP/layout/default" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f static default
          git commit --quiet -m "Release $TAG: app layout for Import from Git"
          git tag -f -a "$TAG" -m "Pulse $TAG"
          git push --force origin "refs/tags/$TAG"
          # Keep the release commit on a branch too: Cribl upgrades a Git-installed app with a plain fetch,
          # which only brings branches (and tags pointing into them).
          # Only a production tag moves what Git installs pull: a `-staging` rehearsal must not change
          # `latest` or `release` for the orgs that installed from Git.
          case "$TAG" in
            *-staging) echo "Staging tag: latest and release stay where they are." ;;
            *)
              git push --force origin HEAD:refs/heads/release
              git tag -f latest
              git push --force origin refs/tags/latest
              ;;
          esac

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TGZ" --clobber
          else
            CHANGELOG="$RUNNER_TEMP/changelog.md"
            awk -v version="$VERSION" '
              $0 ~ "^## \\[" version "\\]( |$)" {
                found = 1
                next
              }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > "$CHANGELOG"
            cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Changes

          EOF
            if [ -s "$CHANGELOG" ]; then
              cat "$CHANGELOG" >> "$RUNNER_TEMP/notes.md"
              printf '\n' >> "$RUNNER_TEMP/notes.md"
            else
              echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md) for the changes in this release." >> "$RUNNER_TEMP/notes.md"
              printf '\n' >> "$RUNNER_TEMP/notes.md"
            fi
            cat >> "$RUNNER_TEMP/notes.md" <<EOF
          ## Install

          - **Cribl Marketplace:** in Cribl, open **Apps → Cribl Marketplace** and install **Pulse** (once Cribl has approved this version).
          - **Import from Git:** **Apps → Add App → Import from Git** with \`${{ github.server_url }}/${{ github.repository }}\` and ref \`latest\`.
          - **Import from File:** upload \`$(basename "$TGZ")\` (below) in **Apps → Add App → Import from File**.
          EOF
            # A staging rehearsal is a pre-release, so it never becomes the repo's Latest release.
            FLAGS=""
            case "$TAG" in *-staging) FLAGS="--prerelease" ;; esac
            gh release create "$TAG" "$TGZ" --verify-tag --title "Pulse $TAG" $FLAGS \
              --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi

      - name: Submit to the Cribl Marketplace (staging)
        if: endsWith(github.event.inputs.tag || github.ref_name, '-staging')
        env:
          TOKEN: ${{ secrets.PACKS_API_TOKEN_STAGING }}
          ENDPOINT: ${{ vars.DISPENSARY_ENDPOINT_STAGING || 'https://packs-staging.cribl.io/extapi/v1/packs' }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::PACKS_API_TOKEN_STAGING is not set; skipping the staging Marketplace publish"
            exit 0
          fi
          curl --fail-with-body --silent --show-error --location "$ENDPOINT/$NAME" \
            --header "Authorization: Bearer $TOKEN" \
            --form "file=@$TGZ"
          echo
          echo "Submitted $(basename "$TGZ") to $ENDPOINT (staging)." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Submit to the Cribl Marketplace (production)
        if: ${{ !endsWith(github.event.inputs.tag || github.ref_name, '-staging') }}
        env:
          TOKEN: ${{ secrets.PACKS_API_TOKEN }}
          ENDPOINT: ${{ vars.DISPENSARY_ENDPOINT || 'https://packs.cribl.io/extapi/v1/packs' }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::PACKS_API_TOKEN is not set; skipping the Marketplace publish"
            exit 0
          fi
          curl --fail-with-body --silent --show-error --location "$ENDPOINT/$NAME" \
            --header "Authorization: Bearer $TOKEN" \
            --form "file=@$TGZ"
          echo
          echo "Submitted $(basename "$TGZ") to $ENDPOINT for Cribl review." | tee -a "$GITHUB_STEP_SUMMARY"
